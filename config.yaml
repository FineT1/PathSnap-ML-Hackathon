seed: 42

data:
  splits_file: data/splits.csv
  candidates_file: data/processed/candidate_features.csv   # written by Person 1 (run_preprocessing.py)
  private_dir: ../pathsnap-private                          # evaluator trips; never read in this stage

features:                # explicit list. Identifiers, coordinates and raw angles are NOT features.
  - distance_m
  - bearing_diff_deg
  - speed_mps
  - time_gap_s
  - segment_length_m
  - n_candidates
  - dist_rank
  - dist_gap_m

modelling:
  cv_folds: 5            # GroupKFold by trip, training trips only
  neg_per_obs: 10        # training only: all correct candidates + up to 10 wrong ones per GPS point
  models:
    - logreg
    - naive_bayes
    - decision_tree
    - random_forest
    - hist_gradient_boosting
